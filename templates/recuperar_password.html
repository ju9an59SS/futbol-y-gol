{% load static %}

<!DOCTYPE html>

<html lang="es">

<head>

    <meta charset="utf-8">

    <title>
        Recuperar contraseña
    </title>


    <link
        href="{% static 'css/bootstrap.min.css' %}"
        rel="stylesheet"
    >

</head>


<body>


<div class="container py-5">

    <div class="row justify-content-center">

        <div class="col-md-6">


            <h2>

                Recuperar contraseña

            </h2>


            {% if tipo == "admin" %}

                <p>
                    Recuperación de cuenta
                    administrativa.
                </p>

            {% else %}

                <p>
                    Recuperación de cuenta
                    de cliente.
                </p>

            {% endif %}


            {% if mensaje %}

                <div class="alert alert-danger">

                    {{ mensaje }}

                </div>

            {% endif %}


            <form method="post">

                {% csrf_token %}


                <div class="mb-3">

                    <label class="form-label">

                        Usuario

                    </label>

                    <input
                        type="text"
                        name="usuario"
                        class="form-control"
                        required
                    >

                </div>


                <div class="mb-3">

                    <label class="form-label">

                        Correo registrado

                    </label>

                    <input
                        type="email"
                        name="correo"
                        class="form-control"
                        required
                    >

                </div>


                <button
                    class="btn btn-primary"
                    type="submit"
                >

                    Enviar código

                </button>

            </form>


        </div>

    </div>

</div>


</body>

</html>
