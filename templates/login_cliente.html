{% load static %}

<!DOCTYPE html>

<html lang="es">

<head>

    <meta charset="utf-8">

    <title>
        Ingreso Cliente
    </title>


    <link
        href="{% static 'css/bootstrap.min.css' %}"
        rel="stylesheet"
    >

</head>


<body>


<div class="container py-5">

    <div class="row justify-content-center">

        <div class="col-md-5">


            <h2>
                Ingreso Cliente
            </h2>


            {% if mensaje %}

                <div class="alert alert-danger">

                    {{ mensaje }}

                </div>

            {% endif %}


            <form method="post">

                {% csrf_token %}


                <div class="mb-3">

                    <label class="form-label">

                        Usuario

                    </label>

                    <input
                        type="text"
                        class="form-control"
                        name="usuario"
                        required
                    >

                </div>


                <div class="mb-3">

                    <label class="form-label">

                        Contraseña

                    </label>

                    <input
                        type="password"
                        class="form-control"
                        name="password"
                        required
                    >

                </div>


                <button
                    class="btn btn-primary"
                    type="submit"
                >

                    Ingresar

                </button>

            </form>


            <div class="mt-3">

                <a
                    href="{% url 'registrar_cliente' %}"
                >

                    Crear cuenta

                </a>

                |

                <a
                    href="{% url 'recuperar_password_cliente' %}"
                >

                    ¿Olvidaste tu contraseña?

                </a>

            </div>


        </div>

    </div>

</div>


</body>

</html>
