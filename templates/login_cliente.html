{% load static %}

<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="utf-8">

    <title>
        Ingreso Cliente - Futbol y Gol
    </title>

    <meta
        content="width=device-width, initial-scale=1.0"
        name="viewport">


    <link
        href="{% static 'img/logo.png' %}"
        rel="icon">


    <link
        rel="preconnect"
        href="https://fonts.gstatic.com">

    <link
        href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Rubik&display=swap"
        rel="stylesheet">


    <link
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.0/css/all.min.css"
        rel="stylesheet">

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.4.1/font/bootstrap-icons.css"
        rel="stylesheet">


    <link
        href="{% static 'css/bootstrap.min.css' %}"
        rel="stylesheet">

    <link
        href="{% static 'css/style.css' %}"
        rel="stylesheet">

</head>


<body>


    <!-- HEADER -->

    <div class="container-fluid bg-dark px-0">

        <div class="row gx-0">

            <nav
                class="navbar navbar-expand-lg
                       bg-dark navbar-dark
                       p-3 p-lg-0 px-lg-5">


                <a
                    href="{% url 'index' %}"
                    class="navbar-brand d-block d-lg-none">

                    <img
                        src="{% static 'img/logo.png' %}"
                        alt="Logo"
                        width="100px">

                </a>


                <button
                    type="button"
                    class="navbar-toggler"
                    data-bs-toggle="collapse"
                    data-bs-target="#navbarCollapse">

                    <span
                        class="navbar-toggler-icon">
                    </span>

                </button>


                <div
                    class="collapse navbar-collapse
                           justify-content-between"
                    id="navbarCollapse">


                    <div class="navbar-nav mr-auto py-0">


                        <img
                            src="{% static 'img/logo.png' %}"
                            alt="Logo"
                            width="100px">


                        <a
                            href="{% url 'index' %}"
                            class="nav-item nav-link">

                            Inicio

                        </a>


                        <a
                            href="{% url 'login_cliente' %}"
                            class="nav-item nav-link active">

                            Ingreso Cliente

                        </a>


                        <a
                            href="{% url 'login' %}"
                            class="nav-item nav-link">

                            Ingreso Administrador

                        </a>


                    </div>


                    <span
                        class="py-md-3 px-md-5
                               d-none d-lg-block">

                        Futbol y Gol

                    </span>

                </div>

            </nav>

        </div>

    </div>


    <!-- LOGIN -->

    <main class="container p-4">

        <div
            class="row justify-content-center
                   align-items-center g-2">

            <div
                class="col-lg-6
                       col-md-8
                       col-sm-12
                       p-5">


                <h1 class="mb-4">

                    Ingreso Cliente

                </h1>


                {% if mensaje %}

                    <div
                        class="alert alert-danger">

                        {{ mensaje }}

                    </div>

                {% endif %}


                <form
                    method="post"
                    action="{% url 'login_cliente' %}">

                    {% csrf_token %}


                    <div class="mb-3">

                        <label
                            for="usuario"
                            class="form-label">

                            Usuario:

                        </label>

                        <input
                            type="text"
                            class="form-control"
                            id="usuario"
                            name="usuario"
                            required
                            autocomplete="username">

                    </div>


                    <div class="mb-3">

                        <label
                            for="password"
                            class="form-label">

                            Contraseña:

                        </label>

                        <input
                            type="password"
                            class="form-control"
                            id="password"
                            name="password"
                            required
                            autocomplete="current-password">

                    </div>


                    <button
                        type="submit"
                        class="btn btn-primary">

                        Iniciar sesión

                    </button>


                </form>


                <hr class="my-4">


                <div class="text-center">


                    <p class="mb-3">

                        ¿Aún no tienes cuenta?

                    </p>


                    <a
                        href="{% url 'registrar_cliente' %}"
                        class="btn btn-outline-primary m-1">

                        <i class="fas fa-user-plus"></i>

                        Registrar cliente

                    </a>


                    <a
                        href="{% url 'recuperar_password_cliente' %}"
                        class="btn btn-outline-secondary m-1">

                        <i class="fas fa-key"></i>

                        Recuperar contraseña

                    </a>


                </div>

            </div>

        </div>

    </main>


    <!-- FOOTER -->

    <footer>

        <div
            class="container-fluid
                   bg-dark text-secondary
                   px-5 mt-5">

            <div class="row gx-5">

                <div class="col-lg-8 col-md-6">

                    <p class="text-light">

                        <img
                            src="{% static 'img/logo.png' %}"
                            alt="Logo"
                            width="100px">

                        Futbol y Gol

                    </p>

                </div>

            </div>

        </div>


        <script
            src="https://code.jquery.com/jquery-3.4.1.min.js">
        </script>

        <script
            src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.0/dist/js/bootstrap.bundle.min.js">
        </script>

    </footer>


</body>

</html>
