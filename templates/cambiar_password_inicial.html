{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Cambiar contraseña temporal</title>
    <link href="{% static 'css/bootstrap.min.css' %}" rel="stylesheet">
</head>
<body>
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <h1>Cambiar contraseña temporal</h1>
            <div class="alert alert-warning">
                Por seguridad debes reemplazar la contraseña temporal antes de continuar.
            </div>
            {% if mensaje %}
                <div class="alert alert-danger">{{ mensaje }}</div>
            {% endif %}
            <form method="post">
                {% csrf_token %}
                <div class="mb-3">
                    <label class="form-label" for="password1">Nueva contraseña</label>
                    <input class="form-control" type="password" id="password1" name="password1" required autocomplete="new-password">
                </div>
                <div class="mb-3">
                    <label class="form-label" for="password2">Confirmar nueva contraseña</label>
                    <input class="form-control" type="password" id="password2" name="password2" required autocomplete="new-password">
                </div>
                <button class="btn btn-primary" type="submit">Guardar nueva contraseña</button>
            </form>
        </div>
    </div>
</div>
</body>
</html>
