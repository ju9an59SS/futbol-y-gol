{% load static %}

<!DOCTYPE html>

<html lang="es">

<head>

    <meta charset="utf-8">

    <title>
        Administrador Creado
    </title>


    <link
        href="{% static 'css/bootstrap.min.css' %}"
        rel="stylesheet"
    >

</head>


<body>


<div class="container py-5">

    <div class="alert alert-success">

        <h2>
            Administrador creado correctamente
        </h2>


        <p>

            Usuario:

            <strong>
                {{ usuario }}
            </strong>

        </p>


        <p>

            Contraseña temporal:

            <strong>
                {{ password_temporal }}
            </strong>

        </p>


        <p>

            El administrador deberá cambiar
            esta contraseña al iniciar sesión
            por primera vez.

        </p>

    </div>


    <a
        href="{% url 'reservas' %}"
        class="btn btn-primary"
    >

        Volver a Reservas

    </a>

</div>


</body>

</html>
