{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Administrador creado</title>
    <link href="{% static 'css/bootstrap.min.css' %}" rel="stylesheet">
</head>
<body>
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-lg-7">
            <div class="alert alert-success">
                <h2>Administrador creado correctamente</h2>
                <p><strong>Usuario:</strong> {{ usuario }}</p>
                <p><strong>Contraseña temporal:</strong> <code>{{ password_temporal }}</code></p>
                <p>Guárdala y entrégala de forma segura. Se muestra en esta pantalla una sola vez.</p>
            </div>
            <a class="btn btn-primary" href="{% url 'registrar_administrador' %}">Crear otro administrador</a>
            <a class="btn btn-secondary" href="{% url 'reservas' %}">Volver a reservas</a>
        </div>
    </div>
</div>
</body>
</html>
